name: rorr-terraform

# Deploy RORR infrastructure. Each protected branch maps to its own GitHub
# Environment (and therefore its own AWS account credentials and state bucket).
on:
  push:
    branches: [develop, staging, prod]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    branches: [develop, staging, prod]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    # Branch name doubles as the environment name (develop/staging/prod).
    environment: ${{ github.ref_name }}
    env:
      ENV: ${{ github.ref_name }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      TF_IN_AUTOMATION: "true"
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform Init
        run: |
          terraform init -no-color \
            -backend-config="bucket=ai-rorr-tfstate-${ENV}" \
            -backend-config="key=rorr/${ENV}/terraform.tfstate"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive -no-color

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        run: terraform plan -no-color -input=false -var="env=${ENV}" -out=tfplan

      # apply only on push to a protected branch, never on pull_request.
      - name: Terraform Apply
        if: github.event_name == 'push'
        run: terraform apply -no-color -input=false -auto-approve tfplan

      # Ensure pgvector and pgvectorscale are installed on the already-running
      # main_db instance. user_data only runs on (re)boot; this step drives the
      # install over SSM on every apply. Idempotent: no-op if pgvector_16 RPM
      # already present.
      - name: Bootstrap pgvectorscale on running main_db instance
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          MAIN_DB_ID=$(terraform output -raw -no-color main_db_instance_id)
          echo "main_db instance: $MAIN_DB_ID"

          read -r -d '' BOOTSTRAP <<'SCRIPT' || true
          set -euo pipefail
          if rpm -q pgvector_16 >/dev/null 2>&1; then
            echo "pgvector_16 already installed; skipping"
            exit 0
          fi
          dnf install -y pgvector_16
          dnf install -y timescaledb-vector-postgresql-16 || echo "timescaledb-vector not in repos; skipping"
          PG_LIB_EBS=/var/lib/pgsql/lib
          mkdir -p "$PG_LIB_EBS"
          for so in /usr/pgsql-16/lib/vector.so /usr/pgsql-16/lib/pgvectorscale*.so; do
            [ -f "$so" ] && cp "$so" "$PG_LIB_EBS/" || true
          done
          echo "pgvector/pgvectorscale installed; restarting PostgreSQL"
          systemctl restart postgresql
          echo "done"
          SCRIPT

          PARAMS=$(jq -n --arg script "$BOOTSTRAP" '{commands: [$script]}')
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$MAIN_DB_ID" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 180 \
            --region "${AWS_REGION}" \
            --parameters "$PARAMS" \
            --query "Command.CommandId" --output text --no-cli-pager)
          echo "SSM command id: $CMD_ID"
          STATUS="Pending"
          for i in $(seq 1 36); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "$MAIN_DB_ID" \
              --region "${AWS_REGION}" \
              --query "Status" --output text --no-cli-pager 2>/dev/null || echo "Pending")
            echo "attempt $i/36: status=$STATUS"
            if [ "$STATUS" = "Success" ] || [ "$STATUS" = "Failed" ]; then break; fi
          done
          OUT=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$MAIN_DB_ID" \
            --region "${AWS_REGION}" --query "StandardOutputContent" --output text --no-cli-pager)
          ERR=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$MAIN_DB_ID" \
            --region "${AWS_REGION}" --query "StandardErrorContent" --output text --no-cli-pager)
          echo "----- SSM stdout -----"; echo "$OUT"
          echo "----- SSM stderr -----"; echo "$ERR"
          if [ "$STATUS" != "Success" ]; then
            echo "pgvectorscale bootstrap failed (status: $STATUS)" >&2; exit 1
          fi

      # Ensure the Neo4j Browser web UI jar is present on the already-running
      # Neo4j instance. user_data only installs it on (re)boot, so an in-place
      # apply that does not replace the instance would otherwise never pick up a
      # newly published browser release. This step is idempotent: it no-ops when
      # a browser jar is already installed, and drives the install over SSM.
      - name: Bootstrap neo4j-browser on running instance
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          NEO4J_ID=$(terraform output -raw -no-color neo4j_instance_id)
          echo "neo4j instance: $NEO4J_ID"

          # Build the remote bootstrap script. Kept in a quoted heredoc so no
          # GitHub Actions / shell expansion happens locally; it runs verbatim
          # on the instance under AWS-RunShellScript.
          read -r -d '' BOOTSTRAP <<'SCRIPT' || true
          set -euo pipefail
          NEO4J_LIB_DIR=/var/lib/neo4j/lib
          if ls "$NEO4J_LIB_DIR"/neo4j-browser-*.jar >/dev/null 2>&1; then
            echo "neo4j-browser jar already present in $NEO4J_LIB_DIR; skipping install"
            exit 0
          fi

          BROWSER_BASE="https://repo1.maven.org/maven2/org/neo4j/client/neo4j-browser"

          # Resolve the latest stable Neo4j 5.x browser release from Maven
          # Central metadata (X.Y.Z only, no -M/-RC/-alpha qualifiers).
          BROWSER_VERSION=$(curl -fsSL "$BROWSER_BASE/maven-metadata.xml" \
            | grep -oE '<version>5\.[0-9]+\.[0-9]+</version>' \
            | sed -E 's|</?version>||g' \
            | sort -t. -k1,1n -k2,2n -k3,3n \
            | tail -n1)
          test -n "$BROWSER_VERSION"

          BROWSER_JAR="neo4j-browser-$BROWSER_VERSION.jar"
          BROWSER_URL="$BROWSER_BASE/$BROWSER_VERSION/$BROWSER_JAR"
          TMP_JAR=$(mktemp)

          # Download the jar and verify its SHA1 fail-closed before install.
          curl -fsSL "$BROWSER_URL" -o "$TMP_JAR"
          EXPECTED_SHA1=$(curl -fsSL "$BROWSER_URL.sha1" | tr -d '[:space:]')
          ACTUAL_SHA1=$(sha1sum "$TMP_JAR" | awk '{print $1}')
          if [ "$EXPECTED_SHA1" != "$ACTUAL_SHA1" ]; then
            echo "neo4j-browser SHA1 mismatch: expected $EXPECTED_SHA1 got $ACTUAL_SHA1" >&2
            rm -f "$TMP_JAR"
            exit 1
          fi
          echo "neo4j-browser $BROWSER_VERSION verified; sha1=$ACTUAL_SHA1"

          # Install atomically with neo4j:neo4j ownership, then restart.
          mkdir -p "$NEO4J_LIB_DIR"
          chown neo4j:neo4j "$NEO4J_LIB_DIR"
          install -o neo4j -g neo4j -m 0644 "$TMP_JAR" "$NEO4J_LIB_DIR/$BROWSER_JAR"
          rm -f "$TMP_JAR"
          systemctl restart neo4j
          echo "neo4j-browser $BROWSER_VERSION installed"
          SCRIPT

          # Safely embed the multi-line script into the SSM parameters JSON.
          PARAMS=$(jq -n --arg script "$BOOTSTRAP" '{commands: [$script]}')

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$NEO4J_ID" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 120 \
            --region "${AWS_REGION}" \
            --parameters "$PARAMS" \
            --query "Command.CommandId" --output text --no-cli-pager)
          echo "SSM command id: $CMD_ID"

          # Poll for completion: every 5s, up to 24 attempts (2 minutes).
          STATUS="Pending"
          for i in $(seq 1 24); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "$NEO4J_ID" \
              --region "${AWS_REGION}" \
              --query "Status" --output text --no-cli-pager 2>/dev/null || echo "Pending")
            echo "attempt $i/24: status=$STATUS"
            if [ "$STATUS" = "Success" ] || [ "$STATUS" = "Failed" ]; then
              break
            fi
          done

          OUT=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$NEO4J_ID" \
            --region "${AWS_REGION}" \
            --query "StandardOutputContent" --output text --no-cli-pager)
          ERR=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$NEO4J_ID" \
            --region "${AWS_REGION}" \
            --query "StandardErrorContent" --output text --no-cli-pager)
          echo "----- SSM stdout -----"
          echo "$OUT"
          echo "----- SSM stderr -----"
          echo "$ERR"

          if [ "$STATUS" != "Success" ]; then
            echo "neo4j-browser bootstrap did not succeed (status: $STATUS)" >&2
            exit 1
          fi

      # Persist live connection info back into ai/rorr/{env} for components to read.
      - name: Update ai/rorr secret with connection info
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          MSK=$(terraform output -raw -no-color msk_bootstrap_brokers)
          REDIS_HOST=$(terraform output -raw -no-color redis_endpoint)
          REDIS_PORT=$(terraform output -raw -no-color redis_port)
          DB_HOST=$(terraform output -raw -no-color main_db_private_ip)
          NEO4J_URI=$(terraform output -raw -no-color neo4j_uri)

          CURRENT=$(aws secretsmanager get-secret-value \
            --secret-id "ai/rorr/${ENV}" \
            --region "${AWS_REGION}" \
            --query SecretString --output text --no-cli-pager)

          UPDATED=$(echo "$CURRENT" | jq \
            --arg msk "$MSK" \
            --arg rh "$REDIS_HOST" \
            --arg rp "$REDIS_PORT" \
            --arg dh "$DB_HOST" \
            --arg n4j "$NEO4J_URI" \
            '.msk_bootstrap_servers=$msk | .redis_host=$rh | .redis_port=$rp | .db_host=$dh | .neo4j_uri=$n4j')

          aws secretsmanager put-secret-value \
            --secret-id "ai/rorr/${ENV}" \
            --region "${AWS_REGION}" \
            --secret-string "$UPDATED" \
            --no-cli-pager

      # Persist the DataCenter CI/CD IAM user access key into the deploy-account
      # secret so external CI/CD runners can authenticate.
      - name: Store DataCenter CI/CD credentials in ai/service/account secret
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          DC_KEY_ID=$(terraform output -raw -no-color datacenter_cicd_access_key_id)
          DC_SECRET=$(terraform output -raw -no-color datacenter_cicd_secret_access_key)

          CURRENT=$(aws secretsmanager get-secret-value \
            --secret-id "ai/service/account/${ENV}" \
            --region "${AWS_REGION}" \
            --query SecretString --output text --no-cli-pager)

          UPDATED=$(echo "$CURRENT" | jq \
            --arg id "$DC_KEY_ID" \
            --arg secret "$DC_SECRET" \
            '.aws_access_key_id=$id | .aws_secret_access_key=$secret')

          aws secretsmanager put-secret-value \
            --secret-id "ai/service/account/${ENV}" \
            --region "${AWS_REGION}" \
            --secret-string "$UPDATED" \
            --no-cli-pager
      # Persist full infrastructure inventory to ai/rorr-infra/{env} on every apply.
      - name: Update ai/rorr-infra secret with infra inventory
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          VPC_ID=$(terraform output -raw -no-color vpc_id)
          PRIVATE_SUBNETS=$(terraform output -json -no-color private_subnet_ids)
          PUBLIC_SUBNETS=$(terraform output -json -no-color public_subnet_ids)
          MSK=$(terraform output -raw -no-color msk_bootstrap_brokers)
          REDIS_HOST=$(terraform output -raw -no-color redis_endpoint)
          REDIS_PORT=$(terraform output -raw -no-color redis_port)
          MAIN_DB_IP=$(terraform output -raw -no-color main_db_private_ip)
          MAIN_DB_ID=$(terraform output -raw -no-color main_db_instance_id)
          KAFKA_UI_IP=$(terraform output -raw -no-color kafka_ui_private_ip)
          SOCKET_1_ID=$(terraform output -raw -no-color socket_1_instance_id)
          SOCKET_1_IP=$(terraform output -raw -no-color socket_1_private_ip)
          SOCKET_2_ID=$(terraform output -raw -no-color socket_2_instance_id)
          SOCKET_2_IP=$(terraform output -raw -no-color socket_2_private_ip)
          SOCKET_ALB_DNS=$(terraform output -raw -no-color socket_alb_dns_name)
          SOCKET_ALB_ARN=$(terraform output -raw -no-color socket_alb_arn)
          SOCKET_ALB_ZONE=$(terraform output -raw -no-color socket_alb_zone_id)

          CURRENT=$(aws secretsmanager get-secret-value \
            --secret-id "ai/rorr-infra/${ENV}" \
            --region "${AWS_REGION}" \
            --query SecretString --output text --no-cli-pager)

          UPDATED=$(echo "$CURRENT" | jq \
            --arg vpc        "$VPC_ID" \
            --argjson priv   "$PRIVATE_SUBNETS" \
            --argjson pub    "$PUBLIC_SUBNETS" \
            --arg msk_iam    "$MSK" \
            --arg redis_h    "$REDIS_HOST" \
            --arg redis_p    "$REDIS_PORT" \
            --arg db_ip      "$MAIN_DB_IP" \
            --arg db_id      "$MAIN_DB_ID" \
            --arg kafka_ip   "$KAFKA_UI_IP" \
            --arg s1_id      "$SOCKET_1_ID" \
            --arg s1_ip      "$SOCKET_1_IP" \
            --arg s2_id      "$SOCKET_2_ID" \
            --arg s2_ip      "$SOCKET_2_IP" \
            --arg alb_dns    "$SOCKET_ALB_DNS" \
            --arg alb_arn    "$SOCKET_ALB_ARN" \
            --arg alb_zone   "$SOCKET_ALB_ZONE" \
            '. + {
              network: ((.network // {}) + {
                vpc_id: $vpc,
                private_subnet_ids: $priv,
                public_subnet_ids: $pub
              }),
              msk: ((.msk // {}) + {
                bootstrap_brokers_iam: $msk_iam
              }),
              redis: ((.redis // {}) + {
                endpoint: $redis_h,
                port: ($redis_p | tonumber)
              }),
              ec2: ((.ec2 // {}) + {
                main_db:  ((.ec2.main_db  // {}) + { instance_id: $db_id,   private_ip: $db_ip }),
                kafka_ui: ((.ec2.kafka_ui // {}) + { private_ip: $kafka_ip }),
                socket_1: ((.ec2.socket_1 // {}) + { instance_id: $s1_id,  private_ip: $s1_ip }),
                socket_2: ((.ec2.socket_2 // {}) + { instance_id: $s2_id,  private_ip: $s2_ip })
              }),
              alb: ((.alb // {}) + {
                socket: { dns: $alb_dns, arn: $alb_arn, zone_id: $alb_zone }
              })
            }')

          aws secretsmanager put-secret-value \
            --secret-id "ai/rorr-infra/${ENV}" \
            --region "${AWS_REGION}" \
            --secret-string "$UPDATED" \
            --no-cli-pager

      # Update rorr/{env}/database host when DB instance IP changes.
      - name: Update rorr database secret with db host
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          MAIN_DB_IP=$(terraform output -raw -no-color main_db_private_ip)

          CURRENT=$(aws secretsmanager get-secret-value \
            --secret-id "rorr/${ENV}/database" \
            --region "${AWS_REGION}" \
            --query SecretString --output text --no-cli-pager)

          UPDATED=$(echo "$CURRENT" | jq --arg h "$MAIN_DB_IP" '.host = $h')

          aws secretsmanager put-secret-value \
            --secret-id "rorr/${ENV}/database" \
            --region "${AWS_REGION}" \
            --secret-string "$UPDATED" \
            --no-cli-pager

      # Update rorr/{env}/neo4j uri when the Neo4j instance IP changes.
      - name: Update rorr neo4j secret with uri
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          NEO4J_URI=$(terraform output -raw -no-color neo4j_uri)

          CURRENT=$(aws secretsmanager get-secret-value \
            --secret-id "rorr/${ENV}/neo4j" \
            --region "${AWS_REGION}" \
            --query SecretString --output text --no-cli-pager)

          UPDATED=$(echo "$CURRENT" | jq --arg u "$NEO4J_URI" '.uri = $u')

          aws secretsmanager put-secret-value \
            --secret-id "rorr/${ENV}/neo4j" \
            --region "${AWS_REGION}" \
            --secret-string "$UPDATED" \
            --no-cli-pager

      # Update rorr/{env}/redis host and port when ElastiCache endpoint changes.
      - name: Update rorr redis secret with redis endpoint
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          REDIS_HOST=$(terraform output -raw -no-color redis_endpoint)
          REDIS_PORT=$(terraform output -raw -no-color redis_port)

          CURRENT=$(aws secretsmanager get-secret-value \
            --secret-id "rorr/${ENV}/redis" \
            --region "${AWS_REGION}" \
            --query SecretString --output text --no-cli-pager)

          UPDATED=$(echo "$CURRENT" | jq \
            --arg h "$REDIS_HOST" \
            --arg p "$REDIS_PORT" \
            '.host = $h | .port = $p')

          aws secretsmanager put-secret-value \
            --secret-id "rorr/${ENV}/redis" \
            --region "${AWS_REGION}" \
            --secret-string "$UPDATED" \
            --no-cli-pager
# trigger: sync secrets