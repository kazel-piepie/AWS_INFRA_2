name: provision-prod-missing-resources
on:
  workflow_dispatch:

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: prod
    env:
      AWS_REGION: us-east-1

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Create reader IAM user
        run: |
          set -euo pipefail

          if aws iam get-user --user-name ai-rorr-prod-reader 2>/dev/null; then
            echo "reader user already exists, skipping create"
          else
            aws iam create-user \
              --user-name ai-rorr-prod-reader \
              --tags \
                Key=Project,Value=ai-rorr \
                Key=Environment,Value=prod \
                Key=ManagedBy,Value=out-of-band \
                Key=Purpose,Value=readonly-access
            echo "reader user created"
          fi

      - name: Create access key for reader user and store in Secrets Manager
        run: |
          set -euo pipefail

          # Check if secret already has real credentials
          EXISTING=$(aws secretsmanager get-secret-value \
            --secret-id "ai/rorr/prod-reader-key" \
            --query SecretString --output text 2>/dev/null || echo "{}")

          KEY_ID=$(echo "$EXISTING" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('aws_access_key_id',''))" 2>/dev/null || echo "")

          if [ -n "$KEY_ID" ]; then
            echo "reader key secret already has credentials, skipping"
          else
            KEY_OUTPUT=$(aws iam create-access-key --user-name ai-rorr-prod-reader --output json)
            KEY_ID=$(echo "$KEY_OUTPUT" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['AccessKey']['AccessKeyId'])")
            KEY_SECRET=$(echo "$KEY_OUTPUT" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['AccessKey']['SecretAccessKey'])")
            USER_NAME=$(echo "$KEY_OUTPUT" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['AccessKey']['UserName'])")

            SECRET_VALUE=$(python3 -c "
          import json
          print(json.dumps({
            'aws_access_key_id': '$KEY_ID',
            'aws_secret_access_key': '$KEY_SECRET',
            'user_name': '$USER_NAME'
          }))
          ")

            # Create or update the secret
            if aws secretsmanager describe-secret --secret-id "ai/rorr/prod-reader-key" 2>/dev/null; then
              aws secretsmanager put-secret-value \
                --secret-id "ai/rorr/prod-reader-key" \
                --secret-string "$SECRET_VALUE"
            else
              aws secretsmanager create-secret \
                --name "ai/rorr/prod-reader-key" \
                --secret-string "$SECRET_VALUE" \
                --tags Key=Project,Value=ai-rorr Key=Environment,Value=prod
            fi
            echo "reader key secret stored: $KEY_ID"
          fi

      - name: Create resources-uploader secret
        run: |
          set -euo pipefail

          if aws secretsmanager describe-secret \
            --secret-id "ai/rorr-infra/prod-resources-uploader" 2>/dev/null; then
            echo "prod-resources-uploader secret already exists"
          else
            aws secretsmanager create-secret \
              --name "ai/rorr-infra/prod-resources-uploader" \
              --secret-string "{}" \
              --tags Key=Project,Value=ai-rorr Key=Environment,Value=prod
            echo "prod-resources-uploader secret created"
          fi

      - name: Create S3 deploy bucket
        run: |
          set -euo pipefail

          if aws s3api head-bucket --bucket ai-rorr-prod-deploy 2>/dev/null; then
            echo "ai-rorr-prod-deploy bucket already exists (may be in this or another account)"
            # Check ownership
            OWNER=$(aws s3api get-bucket-location --bucket ai-rorr-prod-deploy 2>&1 || echo "AccessDenied")
            echo "Location check: $OWNER"
          else
            aws s3api create-bucket \
              --bucket ai-rorr-prod-deploy \
              --region us-east-1
            aws s3api put-bucket-versioning \
              --bucket ai-rorr-prod-deploy \
              --versioning-configuration Status=Enabled
            echo "ai-rorr-prod-deploy bucket created"
          fi

      - name: Summary
        run: |
          echo "=== Provision Summary ==="
          echo "IAM user:"
          aws iam get-user --user-name ai-rorr-prod-reader \
            --query 'User.[UserName,CreateDate]' --output text
          echo ""
          echo "Secrets:"
          aws secretsmanager list-secrets \
            --query 'SecretList[?contains(Name,`prod-reader-key`) || contains(Name,`prod-resources-uploader`)].Name' \
            --output text
          echo ""
          echo "S3:"
          aws s3api head-bucket --bucket ai-rorr-prod-deploy && echo "ai-rorr-prod-deploy: exists" || echo "ai-rorr-prod-deploy: not accessible"
